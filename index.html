<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRT 시트 알람 PRO</title>
    <style>
        /* 기본 변수 (라이트 모드) */
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --secondary: #8E8E93;
            --primary: #007AFF; 
            --tab-bg: #E3E3E8;
        }

        /* 다크 모드 (일반) */
        body.dark-mode {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --secondary: #AEAEB2;
            --tab-bg: #3A3A3C;
        }

        /* 다크 모드 (OLED) */
        body.oled-mode {
            --bg: #000000;
            --card: #151515;
            --text: #FFFFFF;
            --secondary: #8E8E93;
            --tab-bg: #222222;
        }

        /* 포인트 색상 테마 */
        body.theme-orange { --primary: #FF9500; }
        body.theme-red { --primary: #FF3B30; }
        body.theme-magenta { --primary: #AF52DE; }
        body.theme-blue { --primary: #007AFF; }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            transition: background 0.3s, color 0.3s, padding 0.3s;
            padding-top: env(safe-area-inset-top);
        }

        .container { max-width: 500px; margin: auto; position: relative; transition: max-width 0.3s; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .current-time-bar { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; transition: 0.3s, text-shadow 0.3s; }
        .settings-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: var(--text); padding: 5px; }

        .tab-menu { display: flex; background: var(--tab-bg); border-radius: 14px; padding: 3px; margin-bottom: 15px; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: bold; color: var(--secondary); border-radius: 11px; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
        .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .card { background: var(--card); border-radius: 24px; padding: 30px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
        #countdown-label { font-size: 15px; color: var(--primary); margin-bottom: 8px; font-weight: 800; height: 1.2em; transition: 0.3s; }
        #timer-text { font-size: 64px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; margin: 5px 0; letter-spacing: -2px; transition: 0.3s, text-shadow 0.3s; }
        #current-task { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.9; transition: 0.3s; }

        .label { font-size: 12px; font-weight: bold; color: var(--secondary); margin: 15px 0 8px 5px; display: block; transition: 0.3s; }
        .radio-group { display: flex; background: var(--tab-bg); border-radius: 12px; padding: 2px; margin-bottom: 10px; }
        .radio-group label { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 10px; cursor: pointer; color: var(--secondary); transition: 0.3s; }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; color: var(--primary); }

        .schedule-card { background: var(--card); border-radius: 18px; padding: 5px; margin-top: 10px; }
        .schedule-item { padding: 14px 18px; border-bottom: 0.5px solid var(--tab-bg); display: flex; justify-content: space-between; font-size: 13px; transition: 0.3s; }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item.active-now { background: var(--tab-bg); border-radius: 14px; color: var(--primary); font-weight: bold; }

        /* 공차 계산 UI */
        .calc-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .calc-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--tab-bg); background: var(--bg); color: var(--text); font-size: 14px; text-align: center; font-weight: 600; transition: 0.3s; }
        .calc-btn-sub { padding: 0 15px; background: var(--tab-bg); color: var(--text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .calc-btn-main { padding: 0 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s; }
        .calc-result-box { margin-top: 12px; padding: 15px; background: var(--bg); border-radius: 12px; font-size: 14px; color: var(--text); line-height: 1.6; font-weight: 500; text-align: center; transition: 0.3s; }

        /* 설정 모달 */
        #settings-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: var(--card); width: 85%; max-width: 350px; max-height: 85vh; overflow-y: auto; border-radius: 28px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: 0.3s; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 800; font-size: 18px; }
        .close-btn { cursor: pointer; font-size: 24px; color: var(--secondary); }

        /* 커스텀 알림 팝업 */
        #custom-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .alert-content { background: var(--card); width: 80%; max-width: 320px; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center; }
        .alert-msg { font-size: 16px; line-height: 1.6; font-weight: 600; color: var(--text); word-break: keep-all; }

        /* 3D 텍스트 모드 */
        body.mode-3d #timer-text { 
            text-shadow: 2px 2px 0px rgba(120,120,120,0.4), 4px 4px 0px rgba(120,120,120,0.2), 6px 6px 8px rgba(0,0,0,0.3); 
        }
        body.mode-3d .current-time-bar { 
            text-shadow: 1px 1px 0px rgba(120,120,120,0.4), 2px 2px 0px rgba(120,120,120,0.2), 3px 3px 5px rgba(0,0,0,0.3); 
        }

        /* FUN (RGB) 모드 */
        @keyframes rgbRainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        body.mode-fun { animation: rgbRainbow 4s linear infinite; }

        /* 🖥️ 태블릿 모드 (DPI 스케일업) */
        body.tablet-mode { padding: 40px; }
        body.tablet-mode .container { max-width: 768px; }
        body.tablet-mode .current-time-bar { font-size: 34px; }
        body.tablet-mode #countdown-label { font-size: 20px; }
        body.tablet-mode #timer-text { font-size: 96px; }
        body.tablet-mode #current-task { font-size: 22px; }
        body.tablet-mode .tab-btn { font-size: 18px; padding: 18px 0; }
        body.tablet-mode .label { font-size: 16px; margin: 20px 0 10px 5px; }
        body.tablet-mode .radio-group label { font-size: 16px; padding: 16px 0; }
        body.tablet-mode .schedule-item { font-size: 17px; padding: 22px 24px; }
        body.tablet-mode .calc-input { font-size: 18px; padding: 16px; }
        body.tablet-mode .calc-btn-sub, body.tablet-mode .calc-btn-main { font-size: 16px; padding: 0 25px; }
        body.tablet-mode .calc-result-box { font-size: 18px; padding: 25px; }
        body.tablet-mode .modal-content, body.tablet-mode .alert-content { max-width: 450px; padding: 35px; }
        body.tablet-mode .modal-header { font-size: 22px; }
        body.tablet-mode .alert-msg { font-size: 20px; }
        
        /* 웹킷 스크롤바 커스텀 */
        .modal-content::-webkit-scrollbar { width: 6px; }
        .modal-content::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }
    </style>
</head>
<body class="theme-blue">

    <div class="container">
        <div class="header">
            <div class="current-time-bar" id="realtime-clock">00:00:00</div>
            <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-rotation" onclick="setMode('rotation')">🔄 교대 근무</button>
            <button class="tab-btn" id="tab-general" onclick="setMode('general')">⏳ 일반 근무</button>
        </div>

        <div class="card">
            <div id="countdown-label">--</div>
            <div id="timer-text">00:00</div>
            <div id="current-task"></div>
        </div>

        <div id="position-section">
            <span class="label">포지션</span>
            <div class="radio-group">
                <input type="radio" name="pos" id="lh" value="lh" checked><label for="lh">LH</label>
                <input type="radio" name="pos" id="rest" value="rest"><label for="rest">휴식</label>
                <input type="radio" name="pos" id="rh" value="rh"><label for="rh">RH</label>
                <input type="radio" name="pos" id="glass" value="glass"><label for="glass">글라스</label>
            </div>
        </div>

        <span class="label">근무조</span>
        <div class="radio-group">
            <input type="radio" name="shift" id="day" value="day" checked><label for="day">☀️ 주간</label>
            <input type="radio" name="shift" id="night" value="night"><label for="night">🌙 야간</label>
        </div>

        <div id="general-extra" style="display: none;">
            <span class="label">차량 도착 예상 (공차 계산)</span>
            <div class="card" style="padding: 15px; margin-bottom: 0;">
                <div class="calc-input-row">
                    <input type="number" id="curr-car" class="calc-input" placeholder="현재 차번 (예: 4011)">
                    <button class="calc-btn-sub" onclick="saveCurrCar()">확인</button>
                </div>
                <div class="calc-input-row">
                    <input type="number" id="target-car" class="calc-input" placeholder="공바디 차번 (예: 4052)">
                    <button class="calc-btn-main" onclick="startCalc()">계산</button>
                </div>
                <div class="calc-result-box" id="calc-result">
                    대기중...
                </div>
            </div>
        </div>

        <span class="label">오늘의 상세 일정</span>
        <div class="schedule-card">
            <div id="schedule-list"></div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target == this) toggleSettings(false)">
        <div class="modal-content">
            <div class="modal-header">
                <span>환경 설정</span>
                <span class="close-btn" onclick="toggleSettings(false)">✕</span>
            </div>

            <span class="label">기능 옵션</span>
            <div class="radio-group">
                <input type="radio" name="feat-calc" id="calc-on" value="on" checked onclick="applyFeatures()"><label for="calc-on">공차계산 ON</label>
                <input type="radio" name="feat-calc" id="calc-off" value="off" onclick="applyFeatures()"><label for="calc-off">OFF</label>
            </div>
            <div class="radio-group">
                <input type="radio" name="feat-full" id="full-on" value="on" onclick="applyFeatures(true)"><label for="full-on">전체화면 ON</label>
                <input type="radio" name="feat-full" id="full-off" value="off" checked onclick="applyFeatures(true)"><label for="full-off">OFF</label>
            </div>
            
            <span class="label">특수 효과 (렌더링)</span>
            <div class="radio-group">
                <input type="radio" name="feat-3d" id="3d-on" value="on" onclick="applyFeatures()"><label for="3d-on">3D 입체 효과 ON</label>
                <input type="radio" name="feat-3d" id="3d-off" value="off" checked onclick="applyFeatures()"><label for="3d-off">OFF</label>
            </div>
            <div class="radio-group">
                <input type="radio" name="feat-fun" id="fun-on" value="on" onclick="applyFeatures()"><label for="fun-on">🌈 FUN (RGB) ON</label>
                <input type="radio" name="feat-fun" id="fun-off" value="off" checked onclick="applyFeatures()"><label for="fun-off">OFF</label>
            </div>
            
            <span class="label">보기 설정 (DPI)</span>
            <div class="radio-group">
                <input type="radio" name="view-mode" id="view-mobile" value="mobile" checked onclick="saveAndApplyTheme()"><label for="view-mobile">📱 스마트폰</label>
                <input type="radio" name="view-mode" id="view-tablet" value="tablet" onclick="saveAndApplyTheme()"><label for="view-tablet">🖥️ 태블릿</label>
            </div>
            
            <span class="label">테마 모드</span>
            <div class="radio-group">
                <input type="radio" name="bg-mode" id="bg-light" value="light" checked onclick="saveAndApplyTheme()"><label for="bg-light">라이트</label>
                <input type="radio" name="bg-mode" id="bg-dark" value="dark" onclick="saveAndApplyTheme()"><label for="bg-dark">다크</label>
                <input type="radio" name="bg-mode" id="bg-oled" value="oled" onclick="saveAndApplyTheme()"><label for="bg-oled">OLED</label>
            </div>

            <span class="label">포인트 컬러</span>
            <div class="radio-group">
                <input type="radio" name="accent" id="acc-blue" value="blue" checked onclick="saveAndApplyTheme()"><label for="acc-blue">Blue</label>
                <input type="radio" name="accent" id="acc-orange" value="orange" onclick="saveAndApplyTheme()"><label for="acc-orange">Org</label>
                <input type="radio" name="accent" id="acc-red" value="red" onclick="saveAndApplyTheme()"><label for="acc-red">Red</label>
                <input type="radio" name="accent" id="acc-magenta" value="magenta" onclick="saveAndApplyTheme()"><label for="acc-magenta">Mag</label>
            </div>
        </div>
    </div>

    <div id="custom-alert" onclick="if(event.target == this) this.style.display='none'">
        <div class="alert-content">
            <div class="alert-msg" id="alert-msg-text"></div>
            <button class="calc-btn-main" onclick="document.getElementById('custom-alert').style.display='none'" style="width:100%; margin-top:20px; padding:15px; font-size:16px;">확인</button>
        </div>
    </div>

            {s:"06:50", e:"07:15", p:"글라스"}, {s:"07:20", e:"07:45", p:"LH"}, {s:"07:50", e:"08:15", p:"휴식"}, {s:"08:20", e:"08:50", p:"RH"},
            {s:"08:50", e:"09:00", p:"휴게시간"}, {s:"09:00", e:"09:25", p:"글라스"}, {s:"09:30", e:"09:55", p:"LH"}, {s:"10:00", e:"10:25", p:"휴식"}, {s:"10:30", e:"11:00", p:"RH"},
            {s:"11:00", e:"11:40", p:"점심"}, {s:"11:40", e:"12:05", p:"글라스"}, {s:"12:10", e:"12:35", p:"LH"}, {s:"12:40", e:"13:05", p:"휴식"}, {s:"13:10", e:"13:40", p:"RH"},
            {s:"13:40", e:"13:50", p:"휴게시간"}, {s:"13:50", e:"14:10", p:"글라스"}, {s:"14:15", e:"14:35", p:"LH"}, {s:"14:40", e:"15:00", p:"휴식"}, {s:"15:05", e:"15:25", p:"RH"},
            {s:"15:35", e:"16:05", p:"글라스", n:true}, {s:"16:10", e:"16:35", p:"LH", n:true}, {s:"16:40", e:"17:05", p:"휴식", n:true}, {s:"17:10", e:"17:40", p:"RH", n:true},
            {s:"17:40", e:"17:50", p:"휴게시간", n:true}, {s:"17:50", e:"18:15", p:"글라스", n:true}, {s:"18:20", e:"18:45", p:"LH", n:true}, {s:"18:50", e:"19:15", p:"휴식", n:true}, {s:"19:20", e:"19:50", p:"RH", n:true},
            {s:"19:50", e:"20:30", p:"저녁", n:true}, {s:"20:30", e:"20:55", p:"글라스", n:true}, {s:"21:00", e:"21:25", p:"LH", n:true}, {s:"21:30", e:"21:55", p:"휴식", n:true}, {s:"22:00", e:"22:30", p:"RH", n:true},
            {s:"22:30", e:"22:40", p:"휴게시간", n:true}, {s:"22:40", e:"23:00", p:"글라스", n:true}, {s:"23:05", e:"23:25", p:"LH", n:true}, {s:"23:30", e:"23:50", p:"휴식", n:true}, {s:"23:55", e:"00:20", p:"RH", n:true}
        ],
        general: [
            {s:"06:50", e:"08:50", p:"오전 근무", n:false}, {s:"08:50", e:"09:00", p:"휴게시간", n:false},
            {s:"09:00", e:"11:00", p:"오전 근무", n:false}, {s:"11:00", e:"11:40", p:"점심", n:false},
            {s:"11:40", e:"13:40", p:"오후 근무", n:false}, {s:"13:40", e:"13:50", p:"휴게시간", n:false},
            {s:"13:50", e:"15:25", p:"오후 근무", n:false}, {s:"15:35", e:"17:40", p:"야간 근무", n:true},
            {s:"17:40", e:"17:50", p:"휴게시간", n:true}, {s:"17:50", e:"19:50", p:"야간 근무", n:true},
            {s:"19:50", e:"20:30", p:"저녁", n:true}, {s:"20:30", e:"22:30", p:"심야 근무", n:true},
            {s:"22:30", e:"22:40", p:"휴게시간", n:true}, {s:"22:40", e:"00:20", p:"심야 근무", n:true}
        ]
    };

    function toggleSettings(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    function showCustomAlert(msg) {
        document.getElementById('alert-msg-text').innerHTML = msg;
        document.getElementById('custom-alert').style.display = 'flex';
    }

    function applyFeatures(isFullToggle = false) {
        // 공차 계산 토글
        const calcOpt = document.querySelector('input[name="feat-calc"]:checked').value;
        localStorage.setItem('feat-calc', calcOpt);
        
        // 전체화면 토글
        const fullOpt = document.querySelector('input[name="feat-full"]:checked').value;
        localStorage.setItem('feat-full', fullOpt);
        
        if(isFullToggle) {
            if (fullOpt === 'on') {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().catch(e=>console.log(e));
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
            } else {
                if (document.fullscreenElement || document.webkitFullscreenElement) {
                    if (document.exitFullscreen) document.exitFullscreen();
                    else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                }
            }
        }

        // 3D 토글
        const tdOpt = document.querySelector('input[name="feat-3d"]:checked').value;
        localStorage.setItem('feat-3d', tdOpt);
        
        // FUN (RGB) 토글
        const funOpt = document.querySelector('input[name="feat-fun"]:checked').value;
        localStorage.setItem('feat-fun', funOpt);

        setMode(currentMode); // 화면 갱신
        applyBodyClasses();
    }

    function applyBodyClasses() {
        const tdOpt = localStorage.getItem('feat-3d') || 'off';
        const funOpt = localStorage.getItem('feat-fun') || 'off';
        
        if (tdOpt === 'on') document.body.classList.add('mode-3d');
        else document.body.classList.remove('mode-3d');
        
        if (funOpt === 'on') document.body.classList.add('mode-fun');
        else document.body.classList.remove('mode-fun');
    }

    function saveAndApplyTheme() {
        const bg = document.querySelector('input[name="bg-mode"]:checked').value;
        const acc = document.querySelector('input[name="accent"]:checked').value;
        const view = document.querySelector('input[name="view-mode"]:checked').value;
        
        localStorage.setItem('theme-bg', bg);
        localStorage.setItem('theme-acc', acc);
        localStorage.setItem('theme-view', view);
        
        document.body.className = '';
        if (bg === 'dark') document.body.classList.add('dark-mode');
        if (bg === 'oled') document.body.classList.add('oled-mode');
        if (view === 'tablet') document.body.classList.add('tablet-mode');
        document.body.classList.add('theme-' + acc);
        
        applyBodyClasses();
    }

    function loadSavedSettings() {
        // 기존 설정 복원
        const bg = localStorage.getItem('theme-bg') || 'light';
        const acc = localStorage.getItem('theme-acc') || 'blue';
        const view = localStorage.getItem('theme-view') || 'mobile';
        document.getElementById('bg-' + bg).checked = true;
        document.getElementById('acc-' + acc).checked = true;
        document.getElementById('view-' + view).checked = true;
        
        // 신규 기능 복원
        const calcOpt = localStorage.getItem('feat-calc') || 'on';
        const fullOpt = localStorage.getItem('feat-full') || 'off';
        const tdOpt = localStorage.getItem('feat-3d') || 'off';
        const funOpt = localStorage.getItem('feat-fun') || 'off';
        
        document.getElementById('calc-' + calcOpt).checked = true;
        document.getElementById('full-' + fullOpt).checked = true;
        document.getElementById('3d-' + tdOpt).checked = true;
        document.getElementById('fun-' + funOpt).checked = true;

        saveAndApplyTheme();
        setMode(currentMode);

        if(localStorage.getItem(`${deviceId}_calcActive`) === 'true') {
            document.getElementById('curr-car').value = localStorage.getItem(`${deviceId}_currDisplay`) || localStorage.getItem(`${deviceId}_initCurrCar`);
            document.getElementById('target-car').value = localStorage.getItem(`${deviceId}_targetCar`) || '';
            runCalc(false);
        }
    }

    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('mode', mode);
        document.getElementById('tab-rotation').classList.toggle('active', mode === 'rotation');
        document.getElementById('tab-general').classList.toggle('active', mode === 'general');
        document.getElementById('position-section').style.display = mode === 'rotation' ? 'block' : 'none';
        
        // 공차 계산 옵션 확인 후 노출
        const calcOpt = localStorage.getItem('feat-calc') || 'on';
        document.getElementById('general-extra').style.display = (mode === 'general' && calcOpt === 'on') ? 'block' : 'none';
        update();
    }

    function saveCurrCar() {
        const curr = parseInt(document.getElementById('curr-car').value);
        if(curr) {
            localStorage.setItem(`${deviceId}_initCurrCar`, curr);
            localStorage.setItem(`${deviceId}_calcStartMs`, Date.now());
            runCalc(false);
        }
    }

    function startCalc() {
        const curr = parseInt(document.getElementById('curr-car').value);
        const target = parseInt(document.getElementById('target-car').value);

        if (!curr || !target || target <= curr) {
            showCustomAlert("차번을 올바르게 입력해주세요.<br><br><span style='font-size:14px; color:var(--secondary);'>공바디 번호가 더 커야 합니다.</span>");
            localStorage.setItem(`${deviceId}_calcActive`, 'false');
            return;
        }
        
        localStorage.setItem(`${deviceId}_initCurrCar`, curr);
        localStorage.setItem(`${deviceId}_targetCar`, target);
        localStorage.setItem(`${deviceId}_calcStartMs`, Date.now());
        localStorage.setItem(`${deviceId}_calcActive`, 'true');
        runCalc(true);
    }

    function runCalc(showPopup = false) {
        if (localStorage.getItem(`${deviceId}_calcActive`) !== 'true') return;
        const calcOpt = localStorage.getItem('feat-calc') || 'on';
        if (calcOpt !== 'on' || currentMode !== 'general') return;

        const initCurr = parseInt(localStorage.getItem(`${deviceId}_initCurrCar`));
        const target = parseInt(localStorage.getItem(`${deviceId}_targetCar`));
        const startMs = parseInt(localStorage.getItem(`${deviceId}_calcStartMs`));
        
        if (!initCurr || !target || !startMs) return;

        const nowMs = Date.now();
        const startObj = new Date(startMs);
        const startMinsOfDay = startObj.getHours() * 60 + startObj.getMinutes();
        
        const breaks = [
            {n: '오전 휴게시간', s: 530, e: 540}, {n: '점심시간', s: 660, e: 700}, {n: '오후 휴게시간', s: 820, e: 830},
            {n: '야간 휴게시간', s: 1060, e: 1070}, {n: '저녁시간', s: 1190, e: 1230}, {n: '심야 휴게시간', s: 1350, e: 1360}
        ];

        let totalWorkMins = (target - initCurr) * (10 / 6.5);
        let simMins = startMinsOfDay;
        let breaksEncountered = new Set();
        let remWork = totalWorkMins;

        while(remWork > 0) {
            let dayMin = simMins % 1440;
            let inBreak = false;
            for (let b of breaks) {
                if (dayMin >= b.s && dayMin < b.e) {
                    breaksEncountered.add(b.n);
                    inBreak = true; break;
                }
            }
            simMins++;
            if (!inBreak) remWork--;
        }

        const realElapsedTotalMins = Math.round(simMins - startMinsOfDay);
        const etaObj = new Date(startMs + realElapsedTotalMins * 60000);
        const fh = String(etaObj.getHours()).padStart(2, '0');
        const fm = String(etaObj.getMinutes()).padStart(2, '0');

        let currentAutoCar = initCurr;
        let elapsedWorkMins = 0;
        let minDiff = Math.floor((nowMs - startMs) / 60000);

        if (minDiff > 0) {
            for (let i = 0; i < minDiff; i++) {
                let dayMin = (startMinsOfDay + i) % 1440;
                let inBreak = false;
                for (let b of breaks) {
                    if (dayMin >= b.s && dayMin < b.e) { inBreak = true; break; }
                }
                if (!inBreak) elapsedWorkMins++;
            }
        }

        if (minDiff >= 10) {
            currentAutoCar = initCurr + Math.floor(elapsedWorkMins / (10 / 6.5));
            localStorage.setItem(`${deviceId}_currDisplay`, currentAutoCar); 
            
            const currInput = document.getElementById('curr-car');
            if (document.activeElement !== currInput) {
                currInput.value = currentAutoCar;
            }
        }

        let remainingRealMins = Math.max(0, Math.floor((etaObj.getTime() - nowMs) / 60000));
        document.getElementById('calc-result').innerHTML = 
            `현재 진행 차번은 약 <b>${currentAutoCar}</b> 이며 <b>${target}</b> 까지는 <b>${remainingRealMins}</b>분이 남았습니다.<br>
            <span style="color:var(--primary); font-size:16px; margin-top:5px; display:inline-block; font-weight:800;">공바디 도착 예상시간은 ${fh}:${fm} 분입니다.</span>`;

        if (showPopup) {
            let bArr = Array.from(breaksEncountered);
            let bStr = bArr.length > 0 ? `<span style="color:var(--secondary); font-size:14px;">(${bArr.join(', ')} 제외)</span><br><br>해당 시간을 제외하고 계산했을 때,` : '휴게시간 간섭 없이 계산했을 때,';
            let msg = `${bStr}<br><span style="font-size:26px; font-weight:900; color:var(--primary); margin-top:10px; display:inline-block;">도착 예상시간은 ${fh}:${fm} 입니다.</span>`;
            showCustomAlert(msg);
        }
    }

    function update() {
        const now = new Date();
        const clockStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
        document.getElementById('realtime-clock').innerText = clockStr;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const nowSec = now.getSeconds();
        const shiftVal = document.querySelector('input[name="shift"]:checked').value;
        let targetData = currentMode === 'general' ? RAW_DATA.general : RAW_DATA[document.querySelector('input[name="pos"]:checked').value];
        const currentSchedule = targetData.filter(item => shiftVal === "night" ? item.n : !item.n);

        let checkMin = nowMin;
        if (shiftVal === "night" && nowMin < 360) checkMin += 1440;
        currentSchedule.forEach(item => {
            let [sh, sm] = item.s.split(':').map(Number);
            let [eh, em] = item.e.split(':').map(Number);
            let start = sh * 60 + sm;
            let end = eh * 60 + em;
            if (shiftVal === "night" && start < 360) start += 1440;
            if (shiftVal === "night" && end < 360) end += 1440;
            if (end < start) end += 1440;
            item._start = start; item._end = end;
        });

        const label = document.getElementById('countdown-label');
        const timer = document.getElementById('timer-text');
        const task = document.getElementById('current-task');

        const firstShift = currentSchedule[0];
        const lastShift = currentSchedule[currentSchedule.length - 1];
        
        let currentShift = currentSchedule.find(i => checkMin >= i._start && checkMin < i._end);
        let nextShift = currentSchedule.find(i => checkMin < i._start);

        if (currentShift) {
            let nextIdx = currentSchedule.indexOf(currentShift) + 1;
            let nxt = currentSchedule[nextIdx];
            let diffSec = (currentShift._end * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentShift.p === "점심" || currentShift.p === "저녁") {
                label.innerText = "식사시간입니다.";
                task.innerText = "식사 맛있게 하십시오.";
            } else if (currentShift.p === "휴게시간") {
                label.innerText = "휴게시간입니다.";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            } else if (currentShift.p === "휴식") {
                label.innerText = "휴식시간입니다.";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            } else {
                if (diffSec <= 600 && nxt) {
                    if (nxt.p === "점심" || nxt.p === "저녁") label.innerText = "곧 식사 시간입니다";
                    else if (nxt.p === "휴게시간" || nxt.p === "휴식") label.innerText = "곧 쉬는 시간입니다";
                    else label.innerText = currentMode === 'general' ? "다음 근무 시작까지" : "남은 교대까지";
                } else {
                    label.innerText = currentMode === 'general' ? "다음 근무 시작까지" : "남은 교대까지";
                }
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            }
        } else if (nextShift && checkMin >= firstShift._start && checkMin < lastShift._end) {
            let diffSec = (nextShift._start * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentMode === 'rotation') {
                label.innerText = "교대시간입니다.";
                task.innerText = `다음 근무: ${nextShift.p} (${nextShift.s} 시작)`;
            } else {
                label.innerText = "대기시간입니다.";
                task.innerText = `다음 일정: ${nextShift.p}`;
            }
        } else {
            timer.innerText = "--:--";
            label.innerText = "OFF"; 
            task.innerText = "퇴근입니다. 오늘 하루도 고생 많으셨습니다.";
        }

        renderList(currentSchedule, currentShift);
        if(currentMode === 'general') runCalc(false);
    }

    function renderList(list, currentShift) {
        const listDiv = document.getElementById('schedule-list');
        listDiv.innerHTML = list.map(item => `
            <div class="schedule-item ${currentShift && item.s === currentShift.s ? 'active-now' : ''}">
                <span>${item.s} ~ ${item.e}</span>
                <span>${item.p}</span>
            </div>
        `).join('');
    }

    document.querySelectorAll('input').forEach(input => input.addEventListener('change', update));
    window.onload = loadSavedSettings;
    setInterval(update, 1000);
</script>
