<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRT 시트 알람 PRO</title>
    <style>
        /* 기본 변수 (라이트 모드) */
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --secondary: #8E8E93;
            --primary: #007AFF; 
            --tab-bg: #E3E3E8;
            --shadow-color: rgba(0,0,0,0.1);
            --3d-depth: #c7c7cc;
        }

        /* 다크 모드 (일반) */
        body.dark-mode {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --secondary: #AEAEB2;
            --tab-bg: #3A3A3C;
            --shadow-color: rgba(0,0,0,0.3);
            --3d-depth: #1c1c1e;
        }

        /* 다크 모드 (OLED) */
        body.oled-mode {
            --bg: #000000;
            --card: #151515;
            --text: #FFFFFF;
            --secondary: #8E8E93;
            --tab-bg: #222222;
            --shadow-color: rgba(255,255,255,0.05);
            --3d-depth: #000000;
        }

        /* 포인트 색상 테마 */
        body.theme-orange { --primary: #FF9500; }
        body.theme-red { --primary: #FF3B30; }
        body.theme-magenta { --primary: #AF52DE; }
        body.theme-blue { --primary: #007AFF; }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            transition: background 0.3s, color 0.3s;
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
            /* 3D 원근감 설정 */
            perspective: 1000px;
        }

        .container { 
            max-width: 500px; margin: auto; position: relative; 
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
        }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; transform: translateZ(10px); }
        .current-time-bar { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .settings-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: var(--text); padding: 5px; }

        .tab-menu { display: flex; background: var(--tab-bg); border-radius: 14px; padding: 3px; margin-bottom: 15px; transform: translateZ(15px); }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: bold; color: var(--secondary); border-radius: 11px; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
        .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px var(--shadow-color); }

        .card { background: var(--card); border-radius: 24px; padding: 30px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px var(--shadow-color); text-align: center; transform: translateZ(20px); transform-style: preserve-3d; }
        #countdown-label { font-size: 15px; color: var(--primary); margin-bottom: 8px; font-weight: 700; height: 1.2em; }
        #timer-text { font-size: 64px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; margin: 5px 0; letter-spacing: -2px; display: inline-block; }
        #current-task { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.9; }

        .label { font-size: 12px; font-weight: bold; color: var(--secondary); margin: 15px 0 8px 5px; display: block; transform: translateZ(10px); }
        .radio-group { display: flex; background: var(--tab-bg); border-radius: 12px; padding: 2px; margin-bottom: 10px; transform: translateZ(15px); }
        .radio-group label { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 10px; cursor: pointer; color: var(--secondary); transition: 0.2s; }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: var(--card); box-shadow: 0 2px 6px var(--shadow-color); font-weight: bold; color: var(--primary); }

        .schedule-card { background: var(--card); border-radius: 18px; padding: 5px; margin-top: 10px; transform: translateZ(15px); }
        .schedule-item { padding: 14px 18px; border-bottom: 0.5px solid var(--tab-bg); display: flex; justify-content: space-between; font-size: 13px; }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item.active-now { background: var(--tab-bg); border-radius: 14px; color: var(--primary); font-weight: bold; }

        /* 설정 모달 */
        #settings-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
            perspective: none; /* 모달은 평면 유지 */
        }
        .modal-content { background: var(--card); width: 85%; max-width: 350px; border-radius: 28px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 800; font-size: 18px; }
        .close-btn { cursor: pointer; font-size: 24px; color: var(--secondary); }

        /* =========================================
           ✨ 3D 엔진 코어 (CSS Extrusion + JS Tracking)
           ========================================= */
        body.mode-3d .container {
            /* JS에서 주는 회전값을 부드럽게 이어줌 */
            transition: transform 0.2s cubic-bezier(0.25, 1, 0.5, 1);
        }

        body.mode-3d [data-3d-text] {
            display: inline-block;
            transform: translateZ(30px);
            /* 그림자를 여러 겹 쌓아 실제 두께(Mesh)가 있는 것처럼 렌더링 */
            text-shadow: 
                0px 1px 0px var(--3d-depth),
                0px 2px 0px var(--3d-depth),
                0px 3px 0px var(--3d-depth),
                0px 4px 10px rgba(0,0,0,0.4);
            transition: text-shadow 0.3s;
        }

        body.mode-3d #timer-text {
            transform: translateZ(50px); /* 메인 타이머는 더 높게 돌출 */
            text-shadow: 
                0px 1px 0px var(--3d-depth),
                0px 2px 0px var(--3d-depth),
                0px 3px 0px var(--3d-depth),
                0px 4px 0px var(--3d-depth),
                0px 5px 0px var(--3d-depth),
                0px 8px 15px rgba(0,0,0,0.5);
        }

        body.mode-3d .card, 
        body.mode-3d .schedule-card, 
        body.mode-3d .tab-menu, 
        body.mode-3d .radio-group {
            box-shadow: 
                -5px 10px 20px var(--shadow-color),
                -1px 3px 0px var(--3d-depth); /* 카드 자체의 두께감 부여 */
        }
    </style>
</head>
<body class="theme-blue">

    <div class="container" id="main-container">
        <div class="header">
            <div class="current-time-bar" id="realtime-clock" data-3d-text>00:00:00</div>
            <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-rotation" onclick="setMode('rotation')" data-3d-text>🔄 교대 근무</button>
            <button class="tab-btn" id="tab-general" onclick="setMode('general')" data-3d-text>⏳ 일반 근무</button>
        </div>

        <div class="card">
            <div id="countdown-label" data-3d-text>--</div>
            <div id="timer-text" data-3d-text>00:00</div>
            <div id="current-task" data-3d-text></div>
        </div>

        <div id="position-section">
            <span class="label" data-3d-text>포지션</span>
            <div class="radio-group">
                <input type="radio" name="pos" id="lh" value="lh" checked><label for="lh" data-3d-text>LH</label>
                <input type="radio" name="pos" id="rest" value="rest"><label for="rest" data-3d-text>휴식</label>
                <input type="radio" name="pos" id="rh" value="rh"><label for="rh" data-3d-text>RH</label>
                <input type="radio" name="pos" id="glass" value="glass"><label for="glass" data-3d-text>글라스</label>
            </div>
        </div>

        <span class="label" data-3d-text>근무조</span>
        <div class="radio-group">
            <input type="radio" name="shift" id="day" value="day" checked><label for="day" data-3d-text>☀️ 주간</label>
            <input type="radio" name="shift" id="night" value="night"><label for="night" data-3d-text>🌙 야간</label>
        </div>

        <span class="label" data-3d-text>오늘의 상세 일정</span>
        <div class="schedule-card">
            <div id="schedule-list"></div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target == this) toggleSettings(false)">
        <div class="modal-content">
            <div class="modal-header">
                <span>환경 설정</span>
                <span class="close-btn" onclick="toggleSettings(false)">✕</span>
            </div>

            <span class="label">✨ 3D 텍스트 옵션</span>
            <div class="radio-group">
                <input type="radio" name="feat-3d" id="3d-on" value="on" onclick="saveAndApplyTheme()"><label for="3d-on">3D 켜기</label>
                <input type="radio" name="feat-3d" id="3d-off" value="off" checked onclick="saveAndApplyTheme()"><label for="3d-off">끄기</label>
            </div>
            
            <span class="label">테마 모드</span>
            <div class="radio-group">
                <input type="radio" name="bg-mode" id="bg-light" value="light" checked onclick="saveAndApplyTheme()"><label for="bg-light">라이트</label>
                <input type="radio" name="bg-mode" id="bg-dark" value="dark" onclick="saveAndApplyTheme()"><label for="bg-dark">다크</label>
                <input type="radio" name="bg-mode" id="bg-oled" value="oled" onclick="saveAndApplyTheme()"><label for="bg-oled">OLED</label>
            </div>

            <span class="label">포인트 컬러</span>
            <div class="radio-group">
                <input type="radio" name="accent" id="acc-blue" value="blue" checked onclick="saveAndApplyTheme()"><label for="acc-blue">Blue</label>
                <input type="radio" name="accent" id="acc-orange" value="orange" onclick="saveAndApplyTheme()"><label for="acc-orange">Org</label>
                <input type="radio" name="accent" id="acc-red" value="red" onclick="saveAndApplyTheme()"><label for="acc-red">Red</label>
                <input type="radio" name="accent" id="acc-magenta" value="magenta" onclick="saveAndApplyTheme()"><label for="acc-magenta">Mag</label>
            </div>
        </div>
    </div>

    function toggleSettings(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    function saveAndApplyTheme() {
        const bg = document.querySelector('input[name="bg-mode"]:checked').value;
        const acc = document.querySelector('input[name="accent"]:checked').value;
        const is3D = document.querySelector('input[name="feat-3d"]:checked').value;

        localStorage.setItem('theme-bg', bg);
        localStorage.setItem('theme-acc', acc);
        localStorage.setItem('feat-3d', is3D);
        
        document.body.className = '';
        if (bg === 'dark') document.body.classList.add('dark-mode');
        if (bg === 'oled') document.body.classList.add('oled-mode');
        if (is3D === 'on') {
            document.body.classList.add('mode-3d');
        } else {
            // 3D가 꺼지면 회전값 초기화
            document.getElementById('main-container').style.transform = `rotateX(0deg) rotateY(0deg)`;
        }
        document.body.classList.add('theme-' + acc);
    }

    function loadSavedSettings() {
        const bg = localStorage.getItem('theme-bg') || 'light';
        const acc = localStorage.getItem('theme-acc') || 'blue';
        const is3D = localStorage.getItem('feat-3d') || 'off';

        document.getElementById('bg-' + bg).checked = true;
        document.getElementById('acc-' + acc).checked = true;
        document.getElementById('3d-' + is3D).checked = true;

        saveAndApplyTheme();
        setMode(currentMode);
    }

    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('mode', mode);
        document.getElementById('tab-rotation').classList.toggle('active', mode === 'rotation');
        document.getElementById('tab-general').classList.toggle('active', mode === 'general');
        document.getElementById('position-section').style.display = mode === 'rotation' ? 'block' : 'none';
        update();
    }

    function update() {
        const now = new Date();
        const clockStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
        document.getElementById('realtime-clock').innerText = clockStr;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const nowSec = now.getSeconds();
        
        const shiftElement = document.querySelector('input[name="shift"]:checked');
        if(!shiftElement) return;
        const shiftVal = shiftElement.value;
        
        let targetData = currentMode === 'general' ? RAW_DATA.general : RAW_DATA[document.querySelector('input[name="pos"]:checked').value];
        const currentSchedule = targetData.filter(item => shiftVal === "night" ? item.n : !item.n);

        let checkMin = nowMin;
        if (shiftVal === "night" && nowMin < 360) checkMin += 1440;
        currentSchedule.forEach(item => {
            let [sh, sm] = item.s.split(':').map(Number);
            let [eh, em] = item.e.split(':').map(Number);
            let start = sh * 60 + sm;
            let end = eh * 60 + em;
            if (shiftVal === "night" && start < 360) start += 1440;
            if (shiftVal === "night" && end < 360) end += 1440;
            if (end < start) end += 1440;
            item._start = start; item._end = end;
        });

        const label = document.getElementById('countdown-label');
        const timer = document.getElementById('timer-text');
        const task = document.getElementById('current-task');

        const firstShift = currentSchedule[0];
        const lastShift = currentSchedule[currentSchedule.length - 1];
        
        if (checkMin < firstShift._start || checkMin >= lastShift._end) {
            timer.innerText = "--:--";
            label.innerText = "OFF"; 
            task.innerText = "퇴근입니다. 오늘 하루도 고생 많으셨습니다.";
            renderList(currentSchedule, null); return;
        }

        let currentShift = currentSchedule.find(i => checkMin >= i._start && checkMin < i._end);
        let nextIdx = currentSchedule.findIndex(i => checkMin >= i._start && checkMin < i._end) + 1;
        let nextShift = currentSchedule[nextIdx];

        if (currentShift) {
            let diffSec = (currentShift._end * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentMode === 'general') {
                if (currentShift.p.includes("점심") || currentShift.p.includes("저녁") || currentShift.p.includes("휴식")) {
                    label.innerText = "다음 근무 시작까지";
                    task.innerText = `${currentShift.p} 시간 (${currentShift.s}~${currentShift.e})`;
                } else {
                    if (diffSec <= 600 && nextShift) {
                        if (nextShift.p.includes("점심") || nextShift.p.includes("저녁")) label.innerText = "곧 식사 시간입니다";
                        else if (nextShift.p.includes("휴식")) label.innerText = "곧 쉬는 시간입니다";
                        else label.innerText = "다음 근무 시작까지";
                    } else {
                        label.innerText = "다음 근무 시작까지";
                    }
                    task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
                }
            } else {
                label.innerText = "남은 교대까지";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            }
        }
        renderList(currentSchedule, currentShift);
    }

    function renderList(list, currentShift) {
        const listDiv = document.getElementById('schedule-list');
        listDiv.innerHTML = list.map(item => `
            <div class="schedule-item ${currentShift && item.s === currentShift.s ? 'active-now' : ''}">
                <span data-3d-text>${item.s} ~ ${item.e}</span>
                <span data-3d-text>${item.p}</span>
            </div>
        `).join('');
    }

    /* -------------------------------------------------------------
       디바이스 기울기(자이로스코프) & 마우스 패럴랙스 3D 이벤트
    ------------------------------------------------------------- */
    const container = document.getElementById('main-container');

    // 데스크탑 마우스 트래킹
    window.addEventListener('mousemove', (e) => {
        if (!document.body.classList.contains('mode-3d')) return;
        
        // 화면 중심을 기준으로 마우스 위치 계산 (-1 ~ 1)
        const xAxis = (window.innerWidth / 2 - e.pageX) / 25; 
        const yAxis = (window.innerHeight / 2 - e.pageY) / 25;
        
        container.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    // 모바일 자이로스코프 트래킹 (스마트폰 기울기 반응)
    window.addEventListener('deviceorientation', (e) => {
        if (!document.body.classList.contains('mode-3d')) return;
        
        // beta(상하 기울기), gamma(좌우 기울기) 제한 설정
        const tiltX = Math.min(Math.max(e.beta - 45, -25), 25); // 디바이스를 45도 들고 있는 것을 기준으로 설정
        const tiltY = Math.min(Math.max(e.gamma, -25), 25);
        
        container.style.transform = `rotateX(${-tiltX}deg) rotateY(${tiltY}deg)`;
    });

    document.querySelectorAll('input').forEach(input => input.addEventListener('change', update));
    window.onload = loadSavedSettings;
    setInterval(update, 1000);
</script>
</body>
