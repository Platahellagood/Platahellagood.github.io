<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRT 시트 알람 PRO</title>
    <style>
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --secondary: #8E8E93;
            --primary: #007AFF; 
            --tab-bg: #E3E3E8;
            --overlay: rgba(0, 0, 0, 0);
        }

        body.dark-mode {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --secondary: #AEAEB2;
            --tab-bg: #3A3A3C;
            --overlay: rgba(0, 0, 0, 0.2);
        }

        body.oled-mode {
            --bg: #000000;
            --card: #151515;
            --text: #FFFFFF;
            --secondary: #8E8E93;
            --tab-bg: #222222;
            --overlay: rgba(0, 0, 0, 0.4);
        }

        /* 날씨 테마 전용 배경 및 오버레이 효과 */
        body.theme-weather {
            --bg: linear-gradient(to bottom, #3a485a, #1a233a);
            --card: rgba(255, 255, 255, 0.12);
            --text: #FFFFFF;
            --secondary: #EBF5FF;
            --primary: #5AC8FA;
            --tab-bg: rgba(255, 255, 255, 0.08);
            --overlay: rgba(0, 0, 0, 0.35);
            background-attachment: fixed;
        }

        body.theme-orange { --primary: #FF9500; }
        body.theme-red { --primary: #FF3B30; }
        body.theme-magenta { --primary: #AF52DE; }
        body.theme-blue { --primary: #007AFF; }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            transition: background 0.3s, color 0.3s;
            padding-top: env(safe-area-inset-top);
            position: relative;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        /* 현실적인 비 애니메이션 효과 캔버스 */
        #weather-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: -1;
            pointer-events: none;
            display: none;
        }

        /* 어두운 대기 오버레이 레이어 */
        body.theme-weather::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--overlay);
            z-index: -2;
            pointer-events: none;
        }

        .container { max-width: 500px; margin: auto; position: relative; z-index: 1; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .current-time-bar { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; }
        .settings-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: var(--text); padding: 5px; }

        /* 날씨 요약 정보 레이아웃 */
        .weather-info-box {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card); border-radius: 16px; padding: 12px 16px; margin-bottom: 15px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-size: 13px; font-weight: 500;
        }
        .weather-details { text-align: right; line-height: 1.4; }

        .tab-menu { display: flex; background: var(--tab-bg); border-radius: 14px; padding: 3px; margin-bottom: 15px; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: bold; color: var(--secondary); border-radius: 11px; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
        .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .card { background: var(--card); border-radius: 24px; padding: 30px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        #countdown-label { font-size: 15px; color: var(--primary); margin-bottom: 8px; font-weight: 700; height: 1.2em; }
        #timer-text { font-size: 64px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; margin: 5px 0; letter-spacing: -2px; }
        #current-task { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.9; }

        .label { font-size: 12px; font-weight: bold; color: var(--secondary); margin: 15px 0 8px 5px; display: block; }
        .radio-group { display: flex; background: var(--tab-bg); border-radius: 12px; padding: 2px; margin-bottom: 10px; }
        .radio-group label { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 10px; cursor: pointer; color: var(--secondary); }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; color: var(--primary); }

        /* 공차 계산 전용 박스 디자인 */
        .tolerance-box {
            background: var(--card); border-radius: 18px; padding: 16px; margin-bottom: 15px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); text-align: center;
        }

        .schedule-card { background: var(--card); border-radius: 18px; padding: 5px; margin-top: 10px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
        .schedule-item { padding: 14px 18px; border-bottom: 0.5px solid var(--tab-bg); display: flex; justify-content: space-between; font-size: 13px; }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item.active-now { background: var(--tab-bg); border-radius: 14px; color: var(--primary); font-weight: bold; }

        /* 설정 모달 */
        #settings-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: var(--card); width: 85%; max-width: 350px; border-radius: 28px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); max-height: 85vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 800; font-size: 18px; }
        .close-btn { cursor: pointer; font-size: 24px; color: var(--secondary); }
        
        /* 체크박스 스타일 커스텀 */
        .checkbox-container { display: flex; align-items: center; justify-content: space-between; padding: 6px 4px; font-size: 14px; color: var(--text); }
        .checkbox-container input { width: 18px; height: 18px; cursor: pointer; accent-color: var(--primary); }
    </style>
</head>

                <input type="radio" name="pos" id="rest" value="rest"><label for="rest">휴식</label>

            <input type="radio" name="shift" id="day" value="day" checked><label for="day">☀️ 주간</label>
            <input type="radio" name="shift" id="night" value="night"><label for="night">🌙 야간</label>
        </div>

        <span class="label">오늘의 상세 일정</span>
        <div class="schedule-card">
            <div id="schedule-list"></div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target == this) toggleSettings(false)">
        <div class="modal-content">

            <span class="label">포인트 컬러</span>
            <div class="radio-group">

                <input type="radio" name="accent" id="acc-orange" value="orange" onclick="saveAndApplyTheme()"><label for="acc-orange">Org</label>
                <input type="radio" name="accent" id="acc-red" value="red" onclick="saveAndApplyTheme()"><label for="acc-red">Red</label>
                <input type="radio" name="accent" id="acc-magenta" value="magenta" onclick="saveAndApplyTheme()"><label for="acc-magenta">Mag</label>

                <label for="chk-tolerance-placement">일반 근무 탭에 공차계산 배치</label>

    function toggleSettings(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    function saveAndApplyTheme() {
        const bg = document.querySelector('input[name="bg-mode"]:checked').value;
        const acc = document.querySelector('input[name="accent"]:checked').value;
        localStorage.setItem('theme-bg', bg);
        localStorage.setItem('theme-acc', acc);
        
        document.body.className = '';
        stopRainAnimation();

        if (bg === 'dark') document.body.classList.add('dark-mode');
        if (bg === 'oled') document.body.classList.add('oled-mode');
        if (bg === 'weather') {
            document.body.classList.add('theme-weather');
            startRainAnimation();
        }
        document.body.classList.add('theme-' + acc);
    }

    function loadSavedSettings() {
        const bg = localStorage.getItem('theme-bg') || 'light';
        const acc = localStorage.getItem('theme-acc') || 'blue';
        const isGeneralTab = localStorage.getItem('tolerance-in-general') === 'true';

        document.getElementById('bg-' + bg).checked = true;
        document.getElementById('acc-' + acc).checked = true;
        document.getElementById('chk-tolerance-placement').checked = isGeneralTab;

        saveAndApplyTheme();
        setMode(currentMode);
        fetchWeatherMock(); // 초기 기상 분석 로드
    }

        const checked = document.getElementById('chk-tolerance-placement').checked;
        localStorage.setItem('tolerance-in-general', checked);
        renderToleranceComponent();
    }

    // 공차 계산 컴포넌트의 가시성 제어 스위처
    function renderToleranceComponent() {
        const container = document.getElementById('tolerance-placement-zone');
        const targetTabInGeneral = localStorage.getItem('tolerance-in-general') === 'true';
        
        // 현재 탭 상태와 설정 창 매칭 여부 체크
        const shouldShow = (targetTabInGeneral && currentMode === 'general') || (!targetTabInGeneral && currentMode === 'rotation');
        
        if (shouldShow) {
            container.innerHTML = `
                <div class="tolerance-box">
                    <div style="font-size:14px; font-weight:700; margin-bottom:4px;">📐 실시간 공차 자동 계산기</div>
                    <div style="font-size:12px; opacity:0.8;">현재 차번 및 타깃 편차 분석 대기 중</div>
                </div>
            `;
        } else {
            container.innerHTML = '';
        }
    }

    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('mode', mode);
        document.getElementById('tab-rotation').classList.toggle('active', mode === 'rotation');
        document.getElementById('tab-general').classList.toggle('active', mode === 'general');
        document.getElementById('position-section').style.display = mode === 'rotation' ? 'block' : 'none';
        
        renderToleranceComponent();
        update();
    }

    // --- 가상 기상 관측소 API 가공 및 데이터 마운트 ---
    function fetchWeatherMock() {
        // 실제 현업망 환경 연동 시 기상청 오픈 API 또는 공공데이터 포털 좌표값 GET 호출 구간
        setTimeout(() => {
            const mockRainProbability = 85; 
            const mockPrecipitation = 4.2;  

            document.getElementById('weather-status').innerText = `🌧️ 현재 위치 비 내림 (흐림)`;
            document.getElementById('weather-details').innerText = `강수확률: ${mockRainProbability}% | 강수량: ${mockPrecipitation}mm`;
        }, 800);
    }

    // --- 고성능 가상 비주얼 렌더링 엔진 (Canvas 기반 60FPS) ---
    function initRainEngine() {
        canvas = document.getElementById('weather-canvas');
        if (!canvas) return;
        ctx = canvas.getContext('2d');
        
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        raindrops = [];
        for (let i = 0; i < 75; i++) {
            raindrops.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                length: Math.random() * 20 + 15,
                speed: Math.random() * 8 + 12,
                opacity: Math.random() * 0.3 + 0.15
            });
        }
    }

    function resizeCanvas() {
        if(canvas) {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
    }

    function drawRainFrame() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.strokeStyle = 'rgba(174, 219, 255, 0.6)';
        ctx.lineWidth = 1.5;
        
        for (let i = 0; i < raindrops.length; i++) {
            let p = raindrops[i];
            ctx.beginPath();
            // 현실감 있는 빗줄기 낙하 각도 구현 (사선 하강 처리)
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(p.x + 2, p.y + p.length);
            ctx.stroke();
            
            p.y += p.speed;
            p.x += 0.5; 
            
            if (p.y > canvas.height) {
                p.y = -p.length;
                p.x = Math.random() * canvas.width;
            }
        }
        animationFrameId = requestAnimationFrame(drawRainFrame);
    }

    function startRainAnimation() {
        const cvs = document.getElementById('weather-canvas');
        if(cvs) cvs.style.display = 'block';
        initRainEngine();
        drawRainFrame();
    }

    function stopRainAnimation() {
        const cvs = document.getElementById('weather-canvas');
        if(cvs) cvs.style.display = 'none';
        if (animationFrameId) {
            cancelAnimationFrame(animationFrameId);
        }
        window.removeEventListener('resize', resizeCanvas);
    }

    function update() {
        const now = new Date();
        const clockStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
        document.getElementById('realtime-clock').innerText = clockStr;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const nowSec = now.getSeconds();
        
        const activeShiftElement = document.querySelector('input[name="shift"]:checked');
        if (!activeShiftElement) return;
        const shiftVal = activeShiftElement.value;
        
        const activePosElement = document.querySelector('input[name="pos"]:checked');
        let targetData = currentMode === 'general' ? RAW_DATA.general : RAW_DATA[activePosElement ? activePosElement.value : 'lh'];
        const currentSchedule = targetData.filter(item => shiftVal === "night" ? item.n : !item.n);

        let checkMin = nowMin;
        if (shiftVal === "night" && nowMin < 360) checkMin += 1440;
        currentSchedule.forEach(item => {
            let [sh, sm] = item.s.split(':').map(Number);
            let [eh, em] = item.e.split(':').map(Number);
            let start = sh * 60 + sm;
            let end = eh * 60 + em;
            if (shiftVal === "night" && start < 360) start += 1440;
            if (shiftVal === "night" && end < 360) end += 1440;
            if (end < start) end += 1440;
            item._start = start; item._end = end;
        });
        const label = document.getElementById('countdown-label');
        const timer = document.getElementById('timer-text');
        const task = document.getElementById('current-task');

        const firstShift = currentSchedule[0];
        const lastShift = currentSchedule[currentSchedule.length - 1];
        
        if (!firstShift || checkMin < firstShift._start || checkMin >= lastShift._end) {
            timer.innerText = "--:--";
            label.innerText = "OFF"; 
            task.innerText = "퇴근입니다. 오늘 하루도 고생 많으셨습니다.";
            renderList(currentSchedule, null); return;
        }

        let currentShift = currentSchedule.find(i => checkMin >= i._start && checkMin < i._end);
        let nextIdx = currentSchedule.findIndex(i => checkMin >= i._start && checkMin < i._end) + 1;
        let nextShift = currentSchedule[nextIdx];
        if (currentShift) {
            let diffSec = (currentShift._end * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentMode === 'general') {
                if (currentShift.p.includes("점심") || currentShift.p.includes("저녁") || currentShift.p.includes("휴식")) {
                    label.innerText = "다음 근무 시작까지";
                    task.innerText = `${currentShift.p} 시간 (${currentShift.s}~${currentShift.e})`;
                } else {
                    if (diffSec <= 600 && nextShift) {
                        if (nextShift.p.includes("점심") || nextShift.p.includes("저녁")) label.innerText = "곧 식사 시간입니다";
                        else if (nextShift.p.includes("휴식")) label.innerText = "곧 쉬는 시간입니다";
                        else label.innerText = "다음 근무 시작까지";
                    } else {
                        label.innerText = "다음 근무 시작까지";
                    }
                    task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
                }
            } else {
                label.innerText = "남은 교대까지";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            }
        }
        renderList(currentSchedule, currentShift);
    }

    function renderList(list, currentShift) {
        const listDiv = document.getElementById('schedule-list');
        listDiv.innerHTML = list.map(item => `
            <div class="schedule-item ${currentShift && item.s === currentShift.s ? 'active-now' : ''}">
                <span>${item.s} ~ ${item.e}</span>
                <span>${item.p}</span>
            </div>
        `).join('');
    }

    document.querySelectorAll('input').forEach(input => input.addEventListener('change', update));
    window.onload = loadSavedSettings;
    setInterval(update, 1000);
</script>
