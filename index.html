<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRT 시트 알람 PRO - 3D Engine</title>
    <style>
        /* 기본 변수 (라이트 모드) */
        :root {
            --bg: #F2F2F7;
            --card: #FFFFFF;
            --text: #1C1C1E;
            --secondary: #8E8E93;
            --primary: #007AFF; 
            --tab-bg: #E3E3E8;
        }

        /* 다크 모드 (일반) */
        body.dark-mode {
            --bg: #1C1C1E;
            --card: #2C2C2E;
            --text: #FFFFFF;
            --secondary: #AEAEB2;
            --tab-bg: #3A3A3C;
        }

        /* 다크 모드 (OLED) */
        body.oled-mode {
            --bg: #000000;
            --card: #151515;
            --text: #FFFFFF;
            --secondary: #8E8E93;
            --tab-bg: #222222;
        }

        /* 포인트 색상 테마 */
        body.theme-orange { --primary: #FF9500; }
        body.theme-red { --primary: #FF3B30; }
        body.theme-magenta { --primary: #AF52DE; }
        body.theme-blue { --primary: #007AFF; }

        body { 
            font-family: -apple-system, sans-serif; 
            background: var(--bg); 
            color: var(--text); 
            margin: 0; padding: 20px; 
            transition: background 0.3s, color 0.3s, padding 0.3s;
            padding-top: env(safe-area-inset-top);
            overflow-x: hidden;
            position: relative;
        }

        /* 3D 캔버스 설정 */
        #three-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none; /* 클릭은 HTML 요소가 받도록 설정 */
            z-index: 10;
            display: none;
        }

        /* 3D 모드가 활성화되었을 때 실제 HTML 글자들을 투명화하여 중복 차단 */
        body.mode-3d #realtime-clock,
        body.mode-3d #countdown-label,
        body.mode-3d #timer-text,
        body.mode-3d #current-task,
        body.mode-3d .tab-btn,
        body.mode-3d .radio-group label,
        body.mode-3d .label,
        body.mode-3d .schedule-item span,
        body.mode-3d .calc-btn-sub,
        body.mode-3d .calc-btn-main {
            color: transparent !important;
            text-shadow: none !important;
            user-select: none;
        }

        body.mode-3d #three-canvas {
            display: block;
            pointer-events: auto; /* 3D 활성화 시 마우스 반응 인터랙션 켜기 */
        }

        .container { max-width: 500px; margin: auto; position: relative; transition: max-width 0.3s; z-index: 1; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .current-time-bar { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; transition: 0.3s; min-height: 35px; display: flex; align-items: center; }
        .settings-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: var(--text); padding: 5px; z-index: 50; position: relative; }

        .tab-menu { display: flex; background: var(--tab-bg); border-radius: 14px; padding: 3px; margin-bottom: 15px; }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: bold; color: var(--secondary); border-radius: 11px; cursor: pointer; border: none; background: transparent; transition: 0.2s; position: relative; }
        .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .card { background: var(--card); border-radius: 24px; padding: 30px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; transition: 0.3s; }
        #countdown-label { font-size: 15px; color: var(--primary); margin-bottom: 8px; font-weight: 800; height: 1.2em; transition: 0.3s; }
        #timer-text { font-size: 64px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; margin: 5px 0; letter-spacing: -2px; transition: 0.3s; min-height: 75px; }
        #current-task { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.9; transition: 0.3s; min-height: 24px; }

        .label { font-size: 12px; font-weight: bold; color: var(--secondary); margin: 15px 0 8px 5px; display: block; transition: 0.3s; min-height: 15px; }
        .radio-group { display: flex; background: var(--tab-bg); border-radius: 12px; padding: 2px; margin-bottom: 10px; }
        .radio-group label { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 10px; cursor: pointer; color: var(--secondary); transition: 0.3s; }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; color: var(--primary); }

        .schedule-card { background: var(--card); border-radius: 18px; padding: 5px; margin-top: 10px; }
        .schedule-item { padding: 14px 18px; border-bottom: 0.5px solid var(--tab-bg); display: flex; justify-content: space-between; font-size: 13px; transition: 0.3s; min-height: 45px; box-sizing: border-box; }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item.active-now { background: var(--tab-bg); border-radius: 14px; color: var(--primary); font-weight: bold; }

        /* 공차 계산 UI */
        .calc-input-row { display: flex; gap: 8px; margin-bottom: 10px; }
        .calc-input { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid var(--tab-bg); background: var(--bg); color: var(--text); font-size: 14px; text-align: center; font-weight: 600; transition: 0.3s; z-index: 20; position: relative; }
        .calc-btn-sub { padding: 0 15px; background: var(--tab-bg); color: var(--text); border: none; border-radius: 10px; font-weight: bold; cursor: pointer; transition: 0.3s; position: relative; }
        .calc-btn-main { padding: 0 15px; background: var(--primary); color: #fff; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.2); transition: 0.3s; position: relative; }
        .calc-result-box { margin-top: 12px; padding: 15px; background: var(--bg); border-radius: 12px; font-size: 14px; color: var(--text); line-height: 1.6; font-weight: 500; text-align: center; transition: 0.3s; }

        /* 설정 모달 */
        #settings-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { 
            background: var(--card); width: 85%; max-width: 350px; border-radius: 28px; padding: 25px; 
            box-shadow: 0 10px 40px rgba(0,0,0,0.4); transition: 0.3s; 
            display: flex; flex-direction: column; max-height: 80vh; z-index: 110;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; font-weight: 800; font-size: 18px; flex-shrink: 0; }
        .close-btn { cursor: pointer; font-size: 24px; color: var(--secondary); }
        .modal-body { overflow-y: auto; flex-grow: 1; padding-right: 5px; }
        .modal-body::-webkit-scrollbar { width: 6px; }
        .modal-body::-webkit-scrollbar-thumb { background: var(--secondary); border-radius: 10px; }

        /* 커스텀 알림 팝업 */
        #custom-alert {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 200; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .alert-content { background: var(--card); width: 80%; max-width: 320px; border-radius: 24px; padding: 30px 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); text-align: center; }
        .alert-msg { font-size: 16px; line-height: 1.6; font-weight: 600; color: var(--text); word-break: keep-all; }

        /* RGB 애니메이션 */
        @keyframes rgbColors {
            0% { color: #FF3B30; }
            25% { color: #FF9500; }
            50% { color: #34C759; }
            75% { color: #007AFF; }
            100% { color: #AF52DE; }
        }
        body.mode-fun #timer-text, body.mode-fun .current-time-bar, body.mode-fun #countdown-label {
            animation: rgbColors 3s infinite alternate;
        }

        /* 태블릿 모드 스케일업 */
        body.tablet-mode { padding: 40px; }
        body.tablet-mode .container { max-width: 768px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>
</head>
<body class="theme-blue">

    <canvas id="three-canvas"></canvas>

    <div class="container" id="main-container">
        <div class="header">
            <div class="current-time-bar" id="realtime-clock" data-3d>00:00:00</div>
            <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-rotation" onclick="setMode('rotation')" data-3d>🔄 교대 근무</button>
            <button class="tab-btn" id="tab-general" onclick="setMode('general')" data-3d>⏳ 일반 근무</button>
        </div>

        <div class="card">
            <div id="countdown-label" data-3d>--</div>
            <div id="timer-text" data-3d>00:00</div>
            <div id="current-task" data-3d></div>
        </div>

        <div id="position-section">
            <span class="label" data-3d>포지션</span>
            <div class="radio-group">
                <input type="radio" name="pos" id="lh" value="lh" checked><label for="lh" data-3d>LH</label>
                <input type="radio" name="pos" id="rest" value="rest"><label for="rest" data-3d>휴식</label>
                <input type="radio" name="pos" id="rh" value="rh"><label for="rh" data-3d>RH</label>
                <input type="radio" name="pos" id="glass" value="glass"><label for="glass" data-3d>글라스</label>
            </div>
        </div>

        <span class="label" data-3d>근무조</span>
        <div class="radio-group">
            <input type="radio" name="shift" id="day" value="day" checked><label for="day" data-3d>☀️ 주간</label>
            <input type="radio" name="shift" id="night" value="night"><label for="night" data-3d>🌙 야간</label>
        </div>

        <div id="general-extra" style="display: none;">
            <span class="label" data-3d>차량 도착 예상 (공차 계산)</span>
            <div class="card" style="padding: 15px; margin-bottom: 0;">
                <div class="calc-input-row">
                    <input type="number" id="curr-car" class="calc-input" placeholder="현재 차번 (예: 4011)">
                    <button class="calc-btn-sub" onclick="saveCurrCar()" data-3d>확인</button>
                </div>
                <div class="calc-input-row">
                    <input type="number" id="target-car" class="calc-input" placeholder="공바디 차번 (예: 4052)">
                    <button class="calc-btn-main" onclick="startCalc()" data-3d>계산</button>
                </div>
                <div class="calc-result-box" id="calc-result">
                    대기중...
                </div>
            </div>
        </div>

        <span class="label" data-3d>오늘의 상세 일정</span>
        <div class="schedule-card">
            <div id="schedule-list"></div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target == this) toggleSettings(false)">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <span>⚙️ 환경 설정 PRO</span>
                <span class="close-btn" onclick="toggleSettings(false)">✕</span>
            </div>
            
            <div class="modal-body">
                <span class="label">🚀 확장 기능 옵션</span>
                <div class="radio-group">
                    <input type="radio" name="feat-calc" id="calc-on" value="on" checked onclick="applyFeatures()"><label for="calc-on">공차계산 ON</label>
                    <input type="radio" name="feat-calc" id="calc-off" value="off" onclick="applyFeatures()"><label for="calc-off">OFF</label>
                </div>
                
                <span class="label">✨ 특수 효과 (렌더링)</span>
                <div class="radio-group">
                    <input type="radio" name="feat-3d" id="3d-on" value="on" onclick="applyFeatures()"><label for="3d-on">3D 메쉬 실사화 ON</label>
                    <input type="radio" name="feat-3d" id="3d-off" value="off" checked onclick="applyFeatures()"><label for="3d-off">OFF</label>
                </div>
                <div class="radio-group">
                    <input type="radio" name="feat-fun" id="fun-on" value="on" onclick="applyFeatures()"><label for="fun-on">🌈 FUN (RGB) ON</label>
                    <input type="radio" name="feat-fun" id="fun-off" value="off" checked onclick="applyFeatures()"><label for="fun-off">OFF</label>
                </div>
                
                <span class="label">🎨 테마 모드</span>
                <div class="radio-group">
                    <input type="radio" name="bg-mode" id="bg-light" value="light" checked onclick="saveAndApplyTheme()"><label for="bg-light">라이트</label>
                    <input type="radio" name="bg-mode" id="bg-dark" value="dark" onclick="saveAndApplyTheme()"><label for="bg-dark">다크</label>
                    <input type="radio" name="bg-mode" id="bg-oled" value="oled" onclick="saveAndApplyTheme()"><label for="bg-oled">OLED</label>
                </div>

                <span class="label">🖌️ 포인트 컬러</span>
                <div class="radio-group">

                    <input type="radio" name="accent" id="acc-red" value="red" onclick="saveAndApplyTheme()"><label for="acc-red">Red</label>
                    <input type="radio" name="accent" id="acc-magenta" value="magenta" onclick="saveAndApplyTheme()"><label for="acc-magenta">Mag</label>
                </div>
            </div>
        </div>
    </div>

        <div class="alert-content" onclick="event.stopPropagation()">
            <div class="alert-msg" id="alert-msg-text"></div>
            <button class="calc-btn-main" onclick="document.getElementById('custom-alert').style.display='none'" style="width:100%; margin-top:20px; padding:15px; font-size:16px;">확인</button>
        </div>
    </div>

    /* -------------------------------------------------------------
       THREE.JS ENGINE CORE IMPLEMENTATION (글자 전체 실사 3D화)
    ------------------------------------------------------------- */
    let scene, camera, renderer, font;
    let textMeshes = [];
    const loader = new THREE.FontLoader();
    
    // 입체 텍스트 생성을 위한 범용 한국어/영문 포함 JSON 폰트 로드
    loader.load('https://threejs.org/examples/fonts/helvetiker_regular.typeface.json', function (loadedFont) {
        font = loadedFont;
        initThree();
        animate();
        loadSavedSettings();
    });

    function initThree() {
        const canvas = document.getElementById('three-canvas');
        scene = new THREE.Scene();
        
        camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 0, 500); // UI 정면을 정사영처럼 바라보도록 유도

        renderer = new THREE.WebGLRenderer({ canvas: canvas, alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 조명 설정 (입체감을 부여하기 위함)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 300);
        scene.add(dirLight);

        window.addEventListener('resize', onWindowResize);
    }

    function onWindowResize() {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        syncHTMLto3D();
    }

    // HTML 엘리먼트들의 현재 위치 좌표를 트래킹하여 3D Mesh 위치 매핑
    function syncHTMLto3D() {
        if (!document.body.classList.contains('mode-3d') || !font) return;

        // 기존 3D 텍스트 객체 전부 제거
        textMeshes.forEach(mesh => scene.remove(mesh));
        textMeshes = [];

        // 현재 선택된 테마 테마 컬러 추출
        const primaryColor = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim() || '#007AFF';

        // data-3d 속성이 붙어 있는 모든 UI 텍스트 추출 및 실사 3D화
        const elements = document.querySelectorAll('[data-3d]');
        elements.forEach(el => {
            if (el.offsetWidth === 0 || el.offsetHeight === 0) return;

            const rect = el.getBoundingClientRect();
            const text = el.innerText.trim();
            if (!text) return;

            // 글자 크기에 맞는 입체 지오메트리 세팅
            const fontSize = parseFloat(window.getComputedStyle(el).fontSize) * 0.45;
            const textGeo = new THREE.TextGeometry(text, {
                font: font,
                size: fontSize,
                height: 4, // 3D 두께 깊이
                curveSegments: 4,
                bevelEnabled: true,
                bevelThickness: 1,
                bevelSize: 0.5,
                bevelOffset: 0,
                bevelSegments: 2
            });

            textGeo.computeBoundingBox();
            const centerOffset = -0.5 * (textGeo.boundingBox.max.x - textGeo.boundingBox.min.x);
            
            // 일반 텍스트 및 하이라이트(포인트) 컬러 연동 정의
            let targetColor = getComputedStyle(document.documentElement).getPropertyValue('--text').trim();
            if (el.id === 'timer-text' || el.id === 'countdown-label' || el.classList.contains('active-now')) {
                targetColor = primaryColor;
            }

            const material = new THREE.MeshStandardMaterial({
                color: new THREE.Color(targetColor),
                roughness: 0.2,
                metalness: 0.5
            });

            const mesh = new THREE.Mesh(textGeo, material);

            // 2D 스크린 좌표를 Three.js 3D 월드 공간 좌표로 정밀 환산
            const x = rect.left + rect.width / 2;
            const y = rect.top + rect.height / 2;

            const vector = new THREE.Vector3(
                (x / window.innerWidth) * 2 - 1,
                -(y / window.innerHeight) * 2 + 1,
                0.5
            );
            vector.unproject(camera);
            const dir = vector.sub(camera.position).normalize();
            const distance = -camera.position.z / dir.z;
            const pos = camera.position.clone().add(dir.multiplyScalar(distance));

            mesh.position.copy(pos);
            mesh.position.x += centerOffset; // 정중앙 정렬 조정
            
            // 마우스 무브 반응을 위한 초기 위치값 저장
            mesh.userData = { 
                baseX: mesh.position.x, 
                baseY: mesh.position.y,
                elId: el.id
            };

            scene.add(mesh);
            textMeshes.push(mesh);
        });
    }

    // 마우스 혹은 자이로 스콥 움직임에 따른 역동적 3D 틸트 애니메이션 효과
    let mouseX = 0, mouseY = 0;
    window.addEventListener('mousemove', (e) => {
        mouseX = (e.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    function animate() {
        requestAnimationFrame(animate);

        if (document.body.classList.contains('mode-3d')) {
            textMeshes.forEach(mesh => {
                // 마우스 움직임 방향으로 텍스트들이 미세하게 회전 및 이동하여 입체감 가속
                mesh.rotation.y = THREE.MathUtils.lerp(mesh.rotation.y, mouseX * 0.3, 0.05);
                mesh.rotation.x = THREE.MathUtils.lerp(mesh.rotation.x, mouseY * 0.3, 0.05);
                
                // 타이머 텍스트 등은 역동적으로 실시간 리액션 펄스 가미
                if(mesh.userData.elId === 'timer-text') {
                    mesh.position.z = Math.sin(Date.now() * 0.003) * 5 + 10;
                }
            });
            renderer.render(scene, camera);
        }
    }

    function applyFeatures() {
        const calcOpt = document.querySelector('input[name="feat-calc"]:checked').value;
        localStorage.setItem('feat-calc', calcOpt);
        
        const tdOpt = document.querySelector('input[name="feat-3d"]:checked').value;
        localStorage.setItem('feat-3d', tdOpt);
        
        const funOpt = document.querySelector('input[name="feat-fun"]:checked').value;
        localStorage.setItem('feat-fun', funOpt);

        setMode(currentMode);
        applyBodyClasses();
    }

    function applyBodyClasses() {
        const tdOpt = localStorage.getItem('feat-3d') || 'off';
        const funOpt = localStorage.getItem('feat-fun') || 'off';
        
        if (tdOpt === 'on') {
            document.body.classList.add('mode-3d');
            setTimeout(syncHTMLto3D, 50); // 렌더링 타이밍 보정
        } else {
            document.body.classList.remove('mode-3d');
        }
        
        if (funOpt === 'on') document.body.classList.add('mode-fun');
        else document.body.classList.remove('mode-fun');
    }

    function saveAndApplyTheme() {
        const bg = document.querySelector('input[name="bg-mode"]:checked').value;
        const acc = document.querySelector('input[name="accent"]:checked').value;
        
        localStorage.setItem('theme-bg', bg);
        localStorage.setItem('theme-acc', acc);
        
        document.body.className = '';
        if (bg === 'dark') document.body.classList.add('dark-mode');
        if (bg === 'oled') document.body.classList.add('oled-mode');
        document.body.classList.add('theme-' + acc);
        
        applyBodyClasses();
        setTimeout(syncHTMLto3D, 100);

    function loadSavedSettings() {
        try {
            const bg = localStorage.getItem('theme-bg') || 'light';
            const acc = localStorage.getItem('theme-acc') || 'blue';
            document.getElementById('bg-' + bg).checked = true;
            document.getElementById('acc-' + acc).checked = true;
            
            const calcOpt = localStorage.getItem('feat-calc') || 'on';
            const tdOpt = localStorage.getItem('feat-3d') || 'off';
            const funOpt = localStorage.getItem('feat-fun') || 'off';
            
            document.getElementById('calc-' + calcOpt).checked = true;
            document.getElementById('3d-' + tdOpt).checked = true;
            document.getElementById('fun-' + funOpt).checked = true;

            saveAndApplyTheme();
            setMode(currentMode);

            if(localStorage.getItem(`${deviceId}_calcActive`) === 'true') {
                document.getElementById('curr-car').value = localStorage.getItem(`${deviceId}_currDisplay`) || localStorage.getItem(`${deviceId}_initCurrCar`);
                document.getElementById('target-car').value = localStorage.getItem(`${deviceId}_targetCar`) || '';
                runCalc(false);
            }
        } catch(e) { console.error(e); }
    }

    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('mode', mode);
        document.getElementById('tab-rotation').classList.toggle('active', mode === 'rotation');
        document.getElementById('tab-general').classList.toggle('active', mode === 'general');
        document.getElementById('position-section').style.display = mode === 'rotation' ? 'block' : 'none';
        
        const calcOpt = localStorage.getItem('feat-calc') || 'on';
        document.getElementById('general-extra').style.display = (mode === 'general' && calcOpt === 'on') ? 'block' : 'none';
        
        update();
        setTimeout(syncHTMLto3D, 60);
    }

    function saveCurrCar() {
        const curr = parseInt(document.getElementById('curr-car').value);
        if(curr) {
            localStorage.setItem(`${deviceId}_initCurrCar`, curr);
            localStorage.setItem(`${deviceId}_calcStartMs`, Date.now());
            runCalc(false);
        }
    }

    function startCalc() {
        const curr = parseInt(document.getElementById('curr-car').value);
        const target = parseInt(document.getElementById('target-car').value);

        if (!curr || !target || target <= curr) {
            showCustomAlert("차번을 올바르게 입력해주세요.");
            localStorage.setItem(`${deviceId}_calcActive`, 'false');
            return;
        }
        
        localStorage.setItem(`${deviceId}_initCurrCar`, curr);
        localStorage.setItem(`${deviceId}_targetCar`, target);
        localStorage.setItem(`${deviceId}_calcStartMs`, Date.now());
        localStorage.setItem(`${deviceId}_calcActive`, 'true');
        runCalc(true);
    }

    function runCalc(showPopup = false) {
        if (localStorage.getItem(`${deviceId}_calcActive`) !== 'true') return;
        const calcOpt = localStorage.getItem('feat-calc') || 'on';
        if (calcOpt !== 'on' || currentMode !== 'general') return;

        const initCurr = parseInt(localStorage.getItem(`${deviceId}_initCurrCar`));
        const target = parseInt(localStorage.getItem(`${deviceId}_targetCar`));
        const startMs = parseInt(localStorage.getItem(`${deviceId}_calcStartMs`));
        
        if (!initCurr || !target || !startMs) return;

        const nowMs = Date.now();
        const startObj = new Date(startMs);
        const startMinsOfDay = startObj.getHours() * 60 + startObj.getMinutes();
        
        const breaks = [
            {n: '오전 휴게시간', s: 530, e: 540}, {n: '점심시간', s: 660, e: 700}, {n: '오후 휴게시간', s: 820, e: 830},
            {n: '야간 휴게시간', s: 1060, e: 1070}, {n: '저녁시간', s: 1190, e: 1230}, {n: '심야 휴게시간', s: 1350, e: 1360}
        ];

        let totalWorkMins = (target - initCurr) * (10 / 6.5);
        let simMins = startMinsOfDay;
        let breaksEncountered = new Set();
        let remWork = totalWorkMins;

        while(remWork > 0) {
            let dayMin = simMins % 1440;
            let inBreak = false;
            for (let b of breaks) {
                if (dayMin >= b.s && dayMin < b.e) {
                    breaksEncountered.add(b.n);
                    inBreak = true; break;
                }
            }
            simMins++;
            if (!inBreak) remWork--;
        }

        const realElapsedTotalMins = Math.round(simMins - startMinsOfDay);
        const etaObj = new Date(startMs + realElapsedTotalMins * 60000);
        const fh = String(etaObj.getHours()).padStart(2, '0');
        const fm = String(etaObj.getMinutes()).padStart(2, '0');

        let currentAutoCar = initCurr;
        let elapsedWorkMins = 0;
        let minDiff = Math.floor((nowMs - startMs) / 60000);

        if (minDiff > 0) {
            for (let i = 0; i < minDiff; i++) {
                let dayMin = (startMinsOfDay + i) % 1440;
                let inBreak = false;
                for (let b of breaks) {
                    if (dayMin >= b.s && dayMin < b.e) { inBreak = true; break; }
                }
                if (!inBreak) elapsedWorkMins++;
            }
        }

        if (minDiff >= 10) {
            currentAutoCar = initCurr + Math.floor(elapsedWorkMins / (10 / 6.5));
            localStorage.setItem(`${deviceId}_currDisplay`, currentAutoCar); 
            document.getElementById('curr-car').value = currentAutoCar;
        }

        let remainingRealMins = Math.max(0, Math.floor((etaObj.getTime() - nowMs) / 60000));
        document.getElementById('calc-result').innerHTML = 
            `현재 진행 차번은 약 <b>${currentAutoCar}</b> 이며 <b>${target}</b> 까지는 <b>${remainingRealMins}</b>분이 남았습니다.<br>
            <span style="color:var(--primary); font-size:16px; margin-top:5px; display:inline-block; font-weight:800;">공바디 도착 예상시간은 ${fh}:${fm} 분입니다.</span>`;

        if (showPopup) {
            let bArr = Array.from(breaksEncountered);
            let bStr = bArr.length > 0 ? `(${bArr.join(', ')} 제외)<br><br>` : '';
            showCustomAlert(`${bStr}도착 예상시간은 ${fh}:${fm} 입니다.`);
        }
    }

    function update() {
        const now = new Date();
        const clockStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
        document.getElementById('realtime-clock').innerText = clockStr;
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const nowSec = now.getSeconds();
        
        const shiftElement = document.querySelector('input[name="shift"]:checked');
        if(!shiftElement) return;
        const shiftVal = shiftElement.value;
        
        let targetData = currentMode === 'general' ? RAW_DATA.general : RAW_DATA[document.querySelector('input[name="pos"]:checked').value];
        const currentSchedule = targetData.filter(item => shiftVal === "night" ? item.n : !item.n);

        let checkMin = nowMin;
        if (shiftVal === "night" && nowMin < 360) checkMin += 1440;
        currentSchedule.forEach(item => {
            let [sh, sm] = item.s.split(':').map(Number);
            let [eh, em] = item.e.split(':').map(Number);
            let start = sh * 60 + sm;
            let end = eh * 60 + em;
            if (shiftVal === "night" && start < 360) start += 1440;
            if (shiftVal === "night" && end < 360) end += 1440;
            if (end < start) end += 1440;
            item._start = start; item._end = end;
        });

        const label = document.getElementById('countdown-label');
        const timer = document.getElementById('timer-text');
        const task = document.getElementById('current-task');

        const firstShift = currentSchedule[0];
        const lastShift = currentSchedule[currentSchedule.length - 1];
        
        let currentShift = currentSchedule.find(i => checkMin >= i._start && checkMin < i._end);
        let nextShift = currentSchedule.find(i => checkMin < i._start);

        let oldTimerText = timer.innerText;

        if (currentShift) {
            let nextIdx = currentSchedule.indexOf(currentShift) + 1;
            let nxt = currentSchedule[nextIdx];
            let diffSec = (currentShift._end * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentShift.p === "점심" || currentShift.p === "저녁") {
                label.innerText = "식사시간입니다.";
                task.innerText = "식사 맛있게 하십시오.";
            } else if (currentShift.p === "휴게시간" || currentShift.p === "휴식") {
                label.innerText = "휴식시간입니다.";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            } else {
                label.innerText = currentMode === 'general' ? "다음 근무 시작까지" : "남은 교대까지";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            }
        } else if (nextShift && checkMin >= firstShift._start && checkMin < lastShift._end) {
            let diffSec = (nextShift._start * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            label.innerText = currentMode === 'rotation' ? "교대시간입니다." : "대기시간입니다.";
            task.innerText = `다음 일정: ${nextShift.p}`;
        } else {
            timer.innerText = "--:--";
            label.innerText = "OFF"; 
            task.innerText = "퇴근입니다. 오늘 하루도 고생 많으셨습니다.";
        }

        renderList(currentSchedule, currentShift);
        if(currentMode === 'general') runCalc(false);

        // 3D 모드가 켜져있고 타이머 텍스트 값이 바뀌었을 때 실시간으로 3D 글자 갱신
        if(oldTimerText !== timer.innerText) {
            syncHTMLto3D();
        }
    }

    function renderList(list, currentShift) {
        const listDiv = document.getElementById('schedule-list');
        listDiv.innerHTML = list.map(item => `
            <div class="schedule-item ${currentShift && item.s === currentShift.s ? 'active-now' : ''}">
                <span data-3d>${item.s} ~ ${item.e}</span>
                <span data-3d>${item.p}</span>
            </div>
        `).join('');
    }

    // 폼 변경 추적 리스너
    document.querySelectorAll('input').forEach(input => input.addEventListener('change', () => {
        update();
        setTimeout(syncHTMLto3D, 50);
    }));

    setInterval(update, 1000);
</script>
</body>
</html>
