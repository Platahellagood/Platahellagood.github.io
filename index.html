<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>FRT 시트 알람 PRO</title>
    <style>
        /* 기본 변수 (라이트 모드) */
        :root {
            --bg: #F2F2F7;
            --card: rgba(255, 255, 255, 0.85); /* 배경이 보이도록 투명도 조정 */
            --text: #1C1C1E;
            --secondary: #8E8E93;
            --primary: #007AFF; 
            --tab-bg: rgba(227, 227, 232, 0.85);
        }

        /* 다크 모드 (일반) */
        body.dark-mode {
            --bg: #1C1C1E;
            --card: rgba(44, 44, 46, 0.85);
            --text: #FFFFFF;
            --secondary: #AEAEB2;
            --tab-bg: rgba(58, 58, 60, 0.85);
        }

        /* 다크 모드 (OLED) */
        body.oled-mode {
            --bg: #000000;
            --card: rgba(21, 21, 21, 0.85);
            --text: #FFFFFF;
            --secondary: #8E8E93;
            --tab-bg: rgba(34, 34, 34, 0.85);
        }

        /* 포인트 색상 테마 */
        body.theme-orange { --primary: #FF9500; }
        body.theme-red { --primary: #FF3B30; }
        body.theme-magenta { --primary: #AF52DE; }
        body.theme-blue { --primary: #007AFF; }

        body { 
            font-family: -apple-system, sans-serif; 
            color: var(--text); 
            margin: 0; padding: 20px; 
            transition: color 0.3s;
            padding-top: env(safe-area-inset-top);
            
            /* 날씨 배경 기본 설정 */
            background-color: var(--bg);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-blend-mode: overlay; /* 테마의 배경색과 이미지를 자연스럽게 섞음 */
            backdrop-filter: blur(2px);
        }

        .container { max-width: 500px; margin: auto; position: relative; z-index: 2; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .current-time-bar { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }
        .settings-btn { font-size: 26px; cursor: pointer; background: none; border: none; color: var(--text); padding: 5px; text-shadow: 0 1px 4px rgba(0,0,0,0.2); }

        /* 날씨 위젯 섹션 */
        .weather-widget {
            text-align: center;
            margin-bottom: 20px;
            padding: 10px;
            background: var(--card);
            border-radius: 18px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        .weather-emoji { font-size: 42px; margin-bottom: 5px; }
        .weather-details { font-size: 13px; font-weight: 600; color: var(--secondary); }

        .tab-menu { display: flex; background: var(--tab-bg); border-radius: 14px; padding: 3px; margin-bottom: 15px; backdrop-filter: blur(10px); }
        .tab-btn { flex: 1; text-align: center; padding: 12px 0; font-size: 14px; font-weight: bold; color: var(--secondary); border-radius: 11px; cursor: pointer; border: none; background: transparent; transition: 0.2s; }
        .tab-btn.active { background: var(--card); color: var(--text); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }

        .card { background: var(--card); border-radius: 24px; padding: 30px 20px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        #countdown-label { font-size: 15px; color: var(--primary); margin-bottom: 8px; font-weight: 700; height: 1.2em; }
        #timer-text { font-size: 64px; font-weight: 800; color: var(--primary); font-variant-numeric: tabular-nums; margin: 5px 0; letter-spacing: -2px; }
        #current-task { font-size: 16px; font-weight: 600; color: var(--text); opacity: 0.9; }

        .label { font-size: 12px; font-weight: bold; color: var(--secondary); margin: 15px 0 8px 5px; display: block; text-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        .radio-group { display: flex; background: var(--tab-bg); border-radius: 12px; padding: 2px; margin-bottom: 10px; backdrop-filter: blur(10px); }
        .radio-group label { flex: 1; text-align: center; padding: 10px 0; font-size: 13px; border-radius: 10px; cursor: pointer; color: var(--secondary); }
        .radio-group input { display: none; }
        .radio-group input:checked + label { background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,0.1); font-weight: bold; color: var(--primary); }

        .schedule-card { background: var(--card); border-radius: 18px; padding: 5px; margin-top: 10px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .schedule-item { padding: 14px 18px; border-bottom: 0.5px solid var(--tab-bg); display: flex; justify-content: space-between; font-size: 13px; }
        .schedule-item:last-child { border-bottom: none; }
        .schedule-item.active-now { background: var(--tab-bg); border-radius: 14px; color: var(--primary); font-weight: bold; }

        /* 설정 모달 */
        #settings-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.6); z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(4px);
        }
        .modal-content { background: var(--card); width: 85%; max-width: 350px; border-radius: 28px; padding: 25px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; font-weight: 800; font-size: 18px; }
        .close-btn { cursor: pointer; font-size: 24px; color: var(--secondary); }
    </style>
</head>
<body class="theme-blue">

    <div class="container">
        <div class="header">
            <div class="current-time-bar" id="realtime-clock">00:00:00</div>
            <button class="settings-btn" onclick="toggleSettings(true)">⚙️</button>
        </div>

        <div class="weather-widget" id="weather-container">
            <div class="weather-emoji" id="w-emoji">⏳</div>
            <div class="weather-details">
                강수 확률: <span id="w-prob">--</span>% &nbsp;|&nbsp; 예상 강수량: <span id="w-amount">--</span>mm
            </div>
        </div>

        <div class="tab-menu">
            <button class="tab-btn active" id="tab-rotation" onclick="setMode('rotation')">🔄 교대 근무</button>
            <button class="tab-btn" id="tab-general" onclick="setMode('general')">⏳ 일반 근무</button>
        </div>

        <div class="card">
            <div id="countdown-label">--</div>
            <div id="timer-text">00:00</div>
            <div id="current-task"></div>
        </div>

        <div id="position-section">
            <span class="label">포지션</span>
            <div class="radio-group">
                <input type="radio" name="pos" id="lh" value="lh" checked><label for="lh">LH</label>
                <input type="radio" name="pos" id="rest" value="rest"><label for="rest">휴식</label>
                <input type="radio" name="pos" id="rh" value="rh"><label for="rh">RH</label>
                <input type="radio" name="pos" id="glass" value="glass"><label for="glass">글라스</label>
            </div>
        </div>

        <span class="label">근무조</span>
        <div class="radio-group">
            <input type="radio" name="shift" id="day" value="day" checked><label for="day">☀️ 주간</label>
            <input type="radio" name="shift" id="night" value="night"><label for="night">🌙 야간</label>
        </div>

        <span class="label">오늘의 상세 일정</span>
        <div class="schedule-card">
            <div id="schedule-list"></div>
        </div>
    </div>

    <div id="settings-modal" onclick="if(event.target == this) toggleSettings(false)">
        <div class="modal-content">
            <div class="modal-header">
                <span>환경 설정</span>
                <span class="close-btn" onclick="toggleSettings(false)">✕</span>
            </div>
            
            <span class="label">테마 모드</span>
            <div class="radio-group">
                <input type="radio" name="bg-mode" id="bg-light" value="light" checked onclick="saveAndApplyTheme()"><label for="bg-light">라이트</label>
                <input type="radio" name="bg-mode" id="bg-dark" value="dark" onclick="saveAndApplyTheme()"><label for="bg-dark">다크</label>
                <input type="radio" name="bg-mode" id="bg-oled" value="oled" onclick="saveAndApplyTheme()"><label for="bg-oled">OLED</label>
            </div>

            <span class="label">포인트 컬러</span>
            <div class="radio-group">
                <input type="radio" name="accent" id="acc-blue" value="blue" checked onclick="saveAndApplyTheme()"><label for="acc-blue">Blue</label>
                <input type="radio" name="accent" id="acc-orange" value="orange" onclick="saveAndApplyTheme()"><label for="acc-orange">Org</label>
                <input type="radio" name="accent" id="acc-red" value="red" onclick="saveAndApplyTheme()"><label for="acc-red">Red</label>
                <input type="radio" name="accent" id="acc-magenta" value="magenta" onclick="saveAndApplyTheme()"><label for="acc-magenta">Mag</label>
            </div>

            <span class="label">공차계산 탭 위치</span>
            <div class="radio-group">
                <input type="radio" name="tolerance-pos" id="tol-general" value="general" checked onclick="saveTolerancePos()"><label for="tol-general">일반 근무</label>
                <input type="radio" name="tolerance-pos" id="tol-rotation" value="rotation" onclick="saveTolerancePos()"><label for="tol-rotation">교대 근무</label>
            </div>
        </div>
    </div>

    function toggleSettings(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
    }

    function saveAndApplyTheme() {
        const bg = document.querySelector('input[name="bg-mode"]:checked').value;
        const acc = document.querySelector('input[name="accent"]:checked').value;
        localStorage.setItem('theme-bg', bg);
        localStorage.setItem('theme-acc', acc);
        
        document.body.className = '';
        if (bg === 'dark') document.body.classList.add('dark-mode');
        if (bg === 'oled') document.body.classList.add('oled-mode');
        document.body.classList.add('theme-' + acc);
    }

    function saveTolerancePos() {
        const pos = document.querySelector('input[name="tolerance-pos"]:checked').value;
        localStorage.setItem('tolerance-pos', pos);
        // 여기서 실제 공차계산 탭 이동 로직은 건드리지 않음
    }

    function loadSavedSettings() {
        const bg = localStorage.getItem('theme-bg') || 'light';
        const acc = localStorage.getItem('theme-acc') || 'blue';
        const tolPos = localStorage.getItem('tolerance-pos') || 'general';

        document.getElementById('bg-' + bg).checked = true;
        document.getElementById('acc-' + acc).checked = true;
        document.getElementById('tol-' + tolPos).checked = true;
        
        saveAndApplyTheme();
        setMode(currentMode);
        
        // 날씨 정보 초기 로드
        fetchWeatherData();
    }

    function setMode(mode) {
        currentMode = mode;
        localStorage.setItem('mode', mode);
        document.getElementById('tab-rotation').classList.toggle('active', mode === 'rotation');
        document.getElementById('tab-general').classList.toggle('active', mode === 'general');
        document.getElementById('position-section').style.display = mode === 'rotation' ? 'block' : 'none';
        update();
    }

    // 날씨 API 및 동적 배경 연동 (Open-Meteo 무료 API 사용)
    function fetchWeatherData() {
        // 기본 위치 (서울), 필요 시 geolocation 사용 가능
        const lat = 37.5665;
        const lon = 126.9780;
        const url = `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=precipitation_probability,precipitation`;

        fetch(url)
            .then(res => res.json())
            .then(data => {
                const current = data.current_weather;
                const currentHour = new Date().getHours();
                
                const prob = data.hourly.precipitation_probability[currentHour] || 0;
                const amount = data.hourly.precipitation[currentHour] || 0;
                
                document.getElementById('w-prob').innerText = prob;
                document.getElementById('w-amount').innerText = amount;

                applyRealisticWeatherBackground(current.weathercode, current.is_day);
            })
            .catch(err => console.error("날씨 데이터를 불러오지 못했습니다:", err));
    }

    function applyRealisticWeatherBackground(code, isDay) {
        let bgUrl = '';
        let emoji = '';

        // WMO 날씨 코드 기반 현실적인 배경 매핑
        if (code === 0) { 
            // 맑음
            bgUrl = isDay ? 'url("https://images.unsplash.com/photo-1601297183314-c09d845e2a39?auto=format&fit=crop&q=80&w=1080")' 
                          : 'url("https://images.unsplash.com/photo-1506318137071-a8e063b4bec0?auto=format&fit=crop&q=80&w=1080")'; 
            emoji = isDay ? '☀️' : '🌕'; 
        } 
        else if (code >= 1 && code <= 3) { 
            // 흐림/구름
            bgUrl = 'url("https://images.unsplash.com/photo-1534088568595-a066f410cbda?auto=format&fit=crop&q=80&w=1080")'; 
            emoji = '☁️'; 
        } 
        else if (code >= 51 && code <= 67 || code >= 80 && code <= 82) { 
            // 비 (현실적인 빗물 창문 GIF)
            bgUrl = 'url("https://media.giphy.com/media/l0HlPeXXPqL4EwKLu/giphy.gif")'; 
            emoji = '🌧️'; 
        } 
        else if (code >= 71 && code <= 77 || code === 85 || code === 86) { 
            // 눈
            bgUrl = 'url("https://media.giphy.com/media/Bd55BEmZuuW8E/giphy.gif")'; 
            emoji = '❄️'; 
        } 
        else if (code >= 95) { 
            // 천둥번개
            bgUrl = 'url("https://media.giphy.com/media/26uff5vH9U1B2v7zO/giphy.gif")'; 
            emoji = '⛈️'; 
        }

        document.body.style.backgroundImage = bgUrl;
        document.getElementById('w-emoji').innerText = emoji;
    }

    function update() {
        const now = new Date();
        const clockStr = now.getHours().toString().padStart(2,'0') + ":" + now.getMinutes().toString().padStart(2,'0') + ":" + now.getSeconds().toString().padStart(2,'0');
        document.getElementById('realtime-clock').innerText = clockStr;
        
        const nowMin = now.getHours() * 60 + now.getMinutes();
        const nowSec = now.getSeconds();
        const isNight = document.querySelector('input[name="shift"]:checked').checked && document.querySelector('input[name="shift"]:checked').value === "night";
        const shiftVal = document.querySelector('input[name="shift"]:checked').value;
        let targetData = currentMode === 'general' ? RAW_DATA.general : RAW_DATA[document.querySelector('input[name="pos"]:checked').value];
        const currentSchedule = targetData.filter(item => shiftVal === "night" ? item.n : !item.n);

        let checkMin = nowMin;
        if (shiftVal === "night" && nowMin < 360) checkMin += 1440;
        
        currentSchedule.forEach(item => {
            let [sh, sm] = item.s.split(':').map(Number);
            let [eh, em] = item.e.split(':').map(Number);
            let start = sh * 60 + sm;
            let end = eh * 60 + em;
            if (shiftVal === "night" && start < 360) start += 1440;
            if (shiftVal === "night" && end < 360) end += 1440;
            if (end < start) end += 1440;
            item._start = start; item._end = end;
        });

        const label = document.getElementById('countdown-label');
        const timer = document.getElementById('timer-text');
        const task = document.getElementById('current-task');

        const firstShift = currentSchedule[0];
        const lastShift = currentSchedule[currentSchedule.length - 1];
        
        if (checkMin < firstShift._start || checkMin >= lastShift._end) {
            timer.innerText = "--:--";
            label.innerText = "OFF"; 
            // 사용자 우선순위 규칙에 따른 퇴근 문구 적용
            task.innerText = "퇴근입니다. 오늘 하루도 고생 많으셨습니다.";
            renderList(currentSchedule, null); return;
        }

        let currentShift = currentSchedule.find(i => checkMin >= i._start && checkMin < i._end);
        let nextIdx = currentSchedule.findIndex(i => checkMin >= i._start && checkMin < i._end) + 1;
        let nextShift = currentSchedule[nextIdx];
        
        if (currentShift) {
            let diffSec = (currentShift._end * 60) - (checkMin * 60 + nowSec);
            timer.innerText = `${String(Math.floor(diffSec / 60)).padStart(2, '0')}:${String(diffSec % 60).padStart(2, '0')}`;
            
            if (currentMode === 'general') {
                if (currentShift.p.includes("점심") || currentShift.p.includes("저녁") || currentShift.p.includes("휴식")) {
                    label.innerText = "다음 근무 시작까지";
                    task.innerText = `${currentShift.p} 시간 (${currentShift.s}~${currentShift.e})`;
                } else {
                    if (diffSec <= 600 && nextShift) {
                        if (nextShift.p.includes("점심") || nextShift.p.includes("저녁")) label.innerText = "곧 식사 시간입니다";
                        else if (nextShift.p.includes("휴식")) label.innerText = "곧 쉬는 시간입니다";
                        else label.innerText = "다음 근무 시작까지";
                    } else {
                        label.innerText = "다음 근무 시작까지";
                    }
                    task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
                }
            } else {
                label.innerText = "남은 교대까지";
                task.innerText = `현재: ${currentShift.p} (${currentShift.s}~${currentShift.e})`;
            }
        }
        renderList(currentSchedule, currentShift);
    }

    function renderList(list, currentShift) {
        const listDiv = document.getElementById('schedule-list');
        listDiv.innerHTML = list.map(item => `
            <div class="schedule-item ${currentShift && item.s === currentShift.s ? 'active-now' : ''}">
                <span>${item.s} ~ ${item.e}</span>
                <span>${item.p}</span>
            </div>
        `).join('');
    }

    document.querySelectorAll('input').forEach(input => input.addEventListener('change', update));
    window.onload = loadSavedSettings;
    setInterval(update, 1000);
    // 날씨 데이터는 30분(1800000ms)마다 주기적으로 업데이트
    setInterval(fetchWeatherData, 1800000);
</script>
